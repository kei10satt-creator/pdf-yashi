name: Deploy PDF Yashi
on:
  push:
    branches: [main]
    paths:
      - pdf_yashi_pwa_v0.9.5_PWA.zip
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app
        run: |
          mkdir -p site tmp
          unzip -q pdf_yashi_pwa_v0.9.5_PWA.zip -d tmp
          cp -a tmp/pdf_yashi_pwa_v0.9.5/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
