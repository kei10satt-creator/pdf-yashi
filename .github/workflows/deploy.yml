name: Deploy PDF Yashi

on:
  push:
    branches:
      - main
    paths:
      - "pdf_yashi_pwa_v0.5.7.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app
        run: |
          rm -rf site tmp
          mkdir -p site tmp
          unzip -q pdf_yashi_pwa_v0.5.7.zip -d tmp
          cp -a tmp/pdf_yashi_pwa_v0.5.7/. site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
